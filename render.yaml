# Full Next.js app (editable forms and saves).
# Set both Turso variables to use the shared database.
# Leave both empty to use the SQLite file on the attached disk.
# Connect this repo in Render: New > Blueprint > this file.
services:
  - type: web
    name: rec-faculty-workflow
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    disk:
      name: rec-sqlite
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8766"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
